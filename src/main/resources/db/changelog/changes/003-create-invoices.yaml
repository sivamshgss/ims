databaseChangeLog:
  - changeSet:
      id: 20261014-01
      author: sivamshgss
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: invoice_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: invoice_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_tax
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: amount_paid
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - createTable:
            tableName: invoice_sequences
            columns:
              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: last_number
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_invoices_organizations

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_invoices_customers

        - addForeignKeyConstraint:
            baseTableName: invoice_sequences
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_invoice_sequences_organizations

        - sql:
            sql: "ALTER TABLE invoices ADD CONSTRAINT chk_invoice_payment_status CHECK (payment_status IN ('UNPAID','PARTIALLY_PAID','PAID'))"