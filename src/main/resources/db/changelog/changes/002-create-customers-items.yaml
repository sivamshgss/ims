databaseChangeLog:
  - changeSet:
      id: 20261013-01
      author: sivamshgss
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: address
                  type: TEXT

        - createTable:
            tableName: items
            columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                - column:
                    name: organization_id
                    type: BIGINT
                    constraints:
                      nullable: false
                - column:
                    name: name
                    type: VARCHAR(150)
                    constraints:
                      nullable: false
                - column:
                    name: price
                    type: NUMERIC(12,2)
                    constraints:
                      nullable: false
                - column:
                    name: tax_rate
                    type: NUMERIC(5,2)
                    constraints:
                      nullable: false

        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_customers_organizations

        - addForeignKeyConstraint:
            baseTableName: items
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_items_organizations

        - createIndex:
            tableName: customers
            indexName: idx_customers_organization_id
            columns:
              - column:
                  name: organization_id

        - createIndex:
           tableName: items
           indexName: idx_items_organization_id
           columns:
             - column:
                 name: organization_id