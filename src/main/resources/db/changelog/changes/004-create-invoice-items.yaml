databaseChangeLog:
  - changeSet:
      id: 20261014-02
      author: sivamshgss
      changes:
        - createTable:
            tableName: invoice_items
            columns:
              - column:
                  name: invoice_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: tax_rate
                  type: NUMERIC(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: tax_amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: invoice_items
            baseColumnNames: invoice_id
            referencedTableName: invoices
            referencedColumnNames: id
            constraintName: fk_invoice_items_invoices

        - addForeignKeyConstraint:
            baseTableName: invoice_items
            baseColumnNames: item_id
            referencedTableName: items
            referencedColumnNames: id
            constraintName: fk_invoice_items_items

        - addPrimaryKey:
            tableName: invoice_items
            columnNames: invoice_id, item_id
            constraintName: pk_invoice_items